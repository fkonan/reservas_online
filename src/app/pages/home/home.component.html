<h4>Agendamiento de citas online</h4>
<style>
  .full-width {
    width: 100%;
  }
  .half-width {
    width: 50%;
  }
</style>
<mat-form-field>
  <mat-label>Selecciona la ciudad</mat-label>
  <mat-select>
    @for (ciudad of ciudades; track ciudad.id) {
    <mat-option [value]="ciudad.id">{{ciudad.ciudad}}</mat-option>
    }
  </mat-select>
</mat-form-field>
