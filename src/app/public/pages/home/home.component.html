<div class="container py-4">
  <div class="row justify-content-center">
    <p class="text-center fs-4 mb-0">Bienvenida a nuestra</p>
    <p class="fs-3 text-center">AGENDA ON-LINE</p>
    <div class="col-md-6 mt-5">
      <h4 class="text-center mb-5 fw-bold">ELIGE TU CIUDAD</h4>
      <mat-form-field appareance="fill" class="w-100">
        <mat-label>Ciudad</mat-label>
        <mat-select (selectionChange)="seleccionarCiudad($event.value)">
          @for (ciudad of ciudades(); track ciudad.id) {
          <mat-option [value]="ciudad">{{ ciudad.ciudad }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <app-card-sedes></app-card-sedes>
  </div>
