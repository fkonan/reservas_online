<app-header-promo></app-header-promo>

<div class="container mt-4">
  @if (categoria(); as cat) {
  <div class="row justify-content-center mt-3">
    <div class="col-md-6 my-3 text-center">
      <h5 class="text-start mb-0" style="letter-spacing: 1px;">{{ cat.categoria | uppercase}}</h5>
    </div>
  </div>
  <div class="row justify-content-center mt-3">
    <div class="col-md-6">
      <div class="servicios-list">
        @for (servicio of cat.servicios; track servicio.id) {
        <div class="servicio-card" (click)="onServicioClick(servicio)">
          <span class="servicio-nombre">{{ servicio.nombre_comercial | uppercase }}</span>
          <!-- <mat-icon class="servicio-chevron">expand_more</mat-icon> -->
        </div>
        } @empty {
        <div class="no-servicios">
          <mat-icon>info</mat-icon>
          <p>No hay servicios disponibles en esta categoría.</p>
        </div>
        }
      </div>
    </div>
  </div>

   <!-- Botón volver -->
  <div class="row justify-content-center mt-4 pb-4">
    <div class="col-12 col-md-8 col-lg-6 text-center">
      <a [routerLink]="['/']" class="btn-back">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
        </svg>
        VOLVER
      </a>
    </div>
  </div>

}
</div>
